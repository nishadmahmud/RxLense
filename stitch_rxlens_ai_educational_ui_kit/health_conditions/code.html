<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>RxLens AI - Onboarding Conditions</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#000309",
                        "secondary": "#436086",
                        "primary": "#010204",
                        "surface-variant": "#e0e3e6",
                        "primary-container": "#1a1d21",
                        "surface": "#f7f9fc",
                        "outline": "#75777b",
                        "on-surface-variant": "#45474a",
                        "error-container": "#ffdad6",
                        "surface-container": "#eceef1",
                        "primary-fixed-dim": "#c5c6cc",
                        "on-primary-fixed": "#191c20",
                        "tertiary-container": "#151e27",
                        "secondary-container": "#b3d1fd",
                        "tertiary-fixed": "#dae3f0",
                        "on-secondary-fixed-variant": "#2a486d",
                        "surface-container-low": "#f2f4f7",
                        "on-secondary": "#ffffff",
                        "on-background": "#191c1e",
                        "surface-tint": "#5c5e63",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c5c6ca",
                        "on-tertiary-fixed": "#141c26",
                        "on-primary-fixed-variant": "#44474b",
                        "secondary-fixed": "#d3e3ff",
                        "on-secondary-fixed": "#001c39",
                        "background": "#f7f9fc",
                        "surface-container-high": "#e6e8eb",
                        "surface-dim": "#d8dadd",
                        "on-primary-container": "#82858a",
                        "inverse-on-surface": "#eff1f4",
                        "primary-fixed": "#e1e2e8",
                        "on-tertiary-fixed-variant": "#3f4852",
                        "surface-bright": "#f7f9fc",
                        "inverse-surface": "#2d3133",
                        "tertiary-fixed-dim": "#bec7d4",
                        "on-surface": "#191c1e",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#abc8f4",
                        "on-secondary-container": "#3c597f",
                        "on-tertiary-container": "#7d8692",
                        "surface-container-highest": "#e0e3e6",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#c5c6cc",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "margin-main": "20px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "safe-bottom": "34px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Epilogue"],
                        "display-md": ["Epilogue"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Epilogue"],
                        "body-md": ["Inter"],
                        "display-lg": ["Epilogue"]
                    },
                    "fontSize": {
                        "headline-sm": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-md": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["30px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-md": ["15px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["34px", { "lineHeight": "41px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Hide scrollbar for chip cloud */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased pt-[47px]"> <!-- iPhone 15 Pro Dynamic Island padding approx -->
<!-- iOS Status Bar Placeholder -->
<div class="fixed top-0 left-0 w-full h-[47px] bg-background/80 backdrop-blur-md z-50 pointer-events-none flex justify-between items-center px-6">
<div class="text-[15px] font-semibold tracking-tight">9:41</div>
<div class="flex gap-2 items-center">
<span class="material-symbols-outlined filled text-[14px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined filled text-[14px]">wifi</span>
<span class="material-symbols-outlined filled text-[14px] rotate-90">battery_full</span>
</div>
</div>
<!-- Onboarding Header -->
<header class="px-margin-main pt-stack-md pb-stack-sm flex items-center justify-between z-40 relative">
<button aria-label="Go Back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-primary hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-8 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
<div class="w-10 h-10 flex items-center justify-center">
<!-- Language Toggle (EN/বাংলা) component as per style guidance -->
<button class="font-label-caps text-label-caps text-secondary px-2 py-1 bg-surface-container-low rounded-lg border border-outline-variant/30">
                EN
            </button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-margin-main pb-[100px] z-10 relative">
<div class="pt-stack-md pb-stack-lg">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-2">Health conditions</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select any existing medical conditions to help RxLens tailor your medicine insights.</p>
</div>
<!-- Search Field -->
<div class="relative mb-stack-lg">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl py-4 pl-12 pr-4 font-body-lg text-body-lg text-primary placeholder-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all shadow-sm" placeholder="Search conditions" type="text"/>
</div>
<!-- Chip Cloud -->
<div class="flex-1 flex flex-col">
<h2 class="font-label-caps text-label-caps text-secondary mb-stack-sm uppercase tracking-widest">Common Conditions</h2>
<div class="flex flex-wrap gap-3 pb-stack-md">
<!-- Selected State (Accent Slate #3D5A80 approximation via secondary theme color) -->
<button class="px-5 py-3 rounded-full border border-secondary bg-secondary text-on-secondary font-body-md text-body-md shadow-sm transition-all flex items-center gap-2">
                    Diabetes Type 2
                    <span class="material-symbols-outlined text-[18px]">check</span>
</button>
<button class="px-5 py-3 rounded-full border border-secondary bg-secondary text-on-secondary font-body-md text-body-md shadow-sm transition-all flex items-center gap-2">
                    Hypertension
                    <span class="material-symbols-outlined text-[18px]">check</span>
</button>
<!-- Unselected States -->
<button class="px-5 py-3 rounded-full border border-outline-variant bg-surface-container-lowest text-primary font-body-md text-body-md hover:bg-surface-container transition-all">
                    Asthma
                </button>
<button class="px-5 py-3 rounded-full border border-outline-variant bg-surface-container-lowest text-primary font-body-md text-body-md hover:bg-surface-container transition-all">
                    High Cholesterol
                </button>
<button class="px-5 py-3 rounded-full border border-outline-variant bg-surface-container-lowest text-primary font-body-md text-body-md hover:bg-surface-container transition-all">
                    Thyroid Disorder
                </button>
<button class="px-5 py-3 rounded-full border border-outline-variant bg-surface-container-lowest text-primary font-body-md text-body-md hover:bg-surface-container transition-all">
                    Arthritis
                </button>
<button class="px-5 py-3 rounded-full border border-outline-variant bg-surface-container-lowest text-primary font-body-md text-body-md hover:bg-surface-container transition-all">
                    Acid Reflux (GERD)
                </button>
<button class="px-5 py-3 rounded-full border border-outline-variant bg-surface-container-lowest text-primary font-body-md text-body-md hover:bg-surface-container transition-all">
                    Migraine
                </button>
</div>
<!-- Add Custom -->
<div class="mt-stack-sm pt-stack-sm border-t border-outline-variant/30">
<button class="w-full flex items-center gap-3 px-4 py-4 rounded-xl border border-dashed border-outline text-secondary hover:bg-secondary-container/20 transition-colors font-body-md text-body-md">
<div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">add</span>
</div>
<span>Add custom condition...</span>
</button>
</div>
</div>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-xl border-t border-outline-variant/10 px-margin-main pb-safe-bottom pt-stack-md z-50">
<div class="flex gap-4">
<button class="flex-1 py-4 px-6 rounded-full border border-outline text-primary font-label-caps text-label-caps uppercase tracking-wider bg-transparent hover:bg-surface-variant transition-colors text-center flex items-center justify-center">
                Skip for now
            </button>
<button class="flex-[2] py-4 px-6 rounded-full bg-primary-container text-on-primary font-label-caps text-label-caps uppercase tracking-wider hover:bg-primary transition-colors text-center flex items-center justify-center gap-2 shadow-md">
                Continue
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
