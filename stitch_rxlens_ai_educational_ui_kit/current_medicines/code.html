<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RxLens AI - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#000309",
                    "secondary": "#436086",
                    "primary": "#010204",
                    "surface-variant": "#e0e3e6",
                    "primary-container": "#1a1d21",
                    "surface": "#f7f9fc",
                    "outline": "#75777b",
                    "on-surface-variant": "#45474a",
                    "error-container": "#ffdad6",
                    "surface-container": "#eceef1",
                    "primary-fixed-dim": "#c5c6cc",
                    "on-primary-fixed": "#191c20",
                    "tertiary-container": "#151e27",
                    "secondary-container": "#b3d1fd",
                    "tertiary-fixed": "#dae3f0",
                    "on-secondary-fixed-variant": "#2a486d",
                    "surface-container-low": "#f2f4f7",
                    "on-secondary": "#ffffff",
                    "on-background": "#191c1e",
                    "surface-tint": "#5c5e63",
                    "on-primary": "#ffffff",
                    "outline-variant": "#c5c6ca",
                    "on-tertiary-fixed": "#141c26",
                    "on-primary-fixed-variant": "#44474b",
                    "secondary-fixed": "#d3e3ff",
                    "on-secondary-fixed": "#001c39",
                    "background": "#f7f9fc",
                    "surface-container-high": "#e6e8eb",
                    "surface-dim": "#d8dadd",
                    "on-primary-container": "#82858a",
                    "inverse-on-surface": "#eff1f4",
                    "primary-fixed": "#e1e2e8",
                    "on-tertiary-fixed-variant": "#3f4852",
                    "surface-bright": "#f7f9fc",
                    "inverse-surface": "#2d3133",
                    "tertiary-fixed-dim": "#bec7d4",
                    "on-surface": "#191c1e",
                    "error": "#ba1a1a",
                    "on-error-container": "#93000a",
                    "secondary-fixed-dim": "#abc8f4",
                    "on-secondary-container": "#3c597f",
                    "on-tertiary-container": "#7d8692",
                    "surface-container-highest": "#e0e3e6",
                    "surface-container-lowest": "#ffffff",
                    "inverse-primary": "#c5c6cc",
                    "on-tertiary": "#ffffff",
                    "on-error": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "12px",
                    "margin-main": "20px",
                    "stack-lg": "32px",
                    "stack-md": "16px",
                    "stack-sm": "8px",
                    "safe-bottom": "34px"
            },
            "fontFamily": {
                    "headline-sm": ["Epilogue"],
                    "display-md": ["Epilogue"],
                    "label-caps": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg-mobile": ["Epilogue"],
                    "body-md": ["Inter"],
                    "display-lg": ["Epilogue"]
            },
            "fontSize": {
                    "headline-sm": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "display-md": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["17px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "display-lg-mobile": ["30px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "body-md": ["15px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "display-lg": ["34px", {"lineHeight": "41px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        }
      }
    </script>
<style>
        .ios-status-bar { height: 47px; }
        .dynamic-island-safe { padding-top: 59px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md relative overflow-hidden">
<!-- iOS Status Bar Simulation (Non-functional, structural only) -->
<div class="fixed top-0 left-0 w-full ios-status-bar z-50 flex justify-between items-center px-6 pointer-events-none">
<span class="font-body-md text-primary font-semibold text-[15px]">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">wifi</span>
<span class="material-symbols-outlined text-[20px] text-primary" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</div>
<!-- Top App Bar - Linear Onboarding context, customized from Shared Components logic -->
<header class="fixed top-0 left-0 w-full z-40 bg-background/90 backdrop-blur-md dynamic-island-safe px-margin-main pb-stack-sm flex items-center justify-between">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary text-[24px]">arrow_back</span>
</button>
<div class="flex gap-2 items-center">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary-container"></div>
</div>
<div class="w-10 h-10"></div> <!-- Spacer for flex balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-main pt-[120px] pb-[120px] overflow-y-auto hide-scrollbar flex flex-col gap-stack-lg">
<!-- Header Section -->
<section class="flex flex-col gap-stack-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">Medicines you already take</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Adding your current prescriptions helps RxLens check for interactions with new ones.</p>
</section>
<!-- Search Area -->
<section class="flex flex-col gap-stack-md relative z-30">
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-[12px] py-3 pl-12 pr-4 font-body-lg text-body-lg text-primary placeholder:text-outline focus:border-outline focus:ring-0 transition-colors shadow-sm" id="med-search" placeholder="Search medicines (e.g., Napa, Seclo)" type="text"/>
</div>
<!-- Search Results Suggestions (Simulated dropdown) -->
<div class="absolute top-[52px] left-0 w-full bg-surface-container-lowest border border-outline-variant/30 rounded-[12px] shadow-lg flex flex-col overflow-hidden z-20">
<button class="flex items-center justify-between p-4 hover:bg-surface-variant transition-colors text-left border-b border-surface-variant/50 last:border-0 group">
<div class="flex flex-col gap-1">
<span class="font-headline-sm text-headline-sm text-primary group-hover:text-primary-container">Napa 500mg</span>
<span class="font-label-caps text-label-caps text-secondary">Paracetamol</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container">add_circle</span>
</button>
<button class="flex items-center justify-between p-4 hover:bg-surface-variant transition-colors text-left border-b border-surface-variant/50 last:border-0 group">
<div class="flex flex-col gap-1">
<span class="font-headline-sm text-headline-sm text-primary group-hover:text-primary-container">Seclo 20mg</span>
<span class="font-label-caps text-label-caps text-secondary">Omeprazole</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container">add_circle</span>
</button>
</div>
</section>
<!-- Selected Medicines List -->
<section class="flex flex-col gap-stack-md mt-[100px]">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Selected (2)</h2>
<div class="flex flex-col gap-stack-sm">
<!-- Selected Item 1 -->
<div class="flex items-center justify-between bg-surface-container-lowest border border-[#E8EBEE] rounded-lg p-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pill</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-primary font-semibold">Thyrox 50mcg</span>
<span class="font-body-md text-body-md text-on-surface-variant">Levothyroxine</span>
</div>
</div>
<button aria-label="Remove medicine" class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-variant/50 hover:bg-surface-variant text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Selected Item 2 -->
<div class="flex items-center justify-between bg-surface-container-lowest border border-[#E8EBEE] rounded-lg p-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pill</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-primary font-semibold">Amlocal 5mg</span>
<span class="font-body-md text-body-md text-on-surface-variant">Amlodipine</span>
</div>
</div>
<button aria-label="Remove medicine" class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-variant/50 hover:bg-surface-variant text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
</section>
</main>
<!-- Bottom Actions - Fixed -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-xl border-t border-outline-variant/20 px-margin-main py-stack-md pb-safe-bottom z-40 flex flex-col gap-stack-sm">
<button class="w-full bg-primary-container text-on-primary rounded-full py-4 font-headline-sm text-headline-sm hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
            Finish Setup
            <span class="material-symbols-outlined text-[20px]">check_circle</span>
</button>
<button class="w-full bg-transparent border border-outline-variant text-primary rounded-full py-4 font-headline-sm text-headline-sm hover:bg-surface-variant/50 transition-colors">
            Skip for now
        </button>
</div>
</body></html>
